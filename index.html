<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خمّن الكلمة | اليوم العالمي للأشعة</title>
<style>
:root{
  color-scheme:light;
  --bg:#f0e6d2;--panel:#fbf5e6;--ink:#2e2312;--muted:#6b5733;--gold:#d39a2e;--gold-deep:#9b6418;--line:#d39a2e;
  --on-gold:#2e2312;--plain:#fffaf0;--good:#2c6e34;--bad:#a8321f;--badbg:#f8e2d8;--goodbg:#e6efd2;--tint:#f3e5bd;
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#1f180e;--panel:#2b2216;--ink:#f4e9d2;--muted:#cbb88f;--gold:#d39a2e;--gold-deep:#e6b95c;--line:#a97a24;
    --on-gold:#2e2312;--plain:#372c1c;--good:#a9d98f;--bad:#ffb09c;--badbg:#4c261c;--goodbg:#2f3d20;--tint:#40331d;
  }
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Noto Kufi Arabic","SF Arabic","Geeza Pro",Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:12px 10px 24px;display:flex;justify-content:center}
.wrap{width:100%;max-width:640px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold-deep);outline-offset:2px}

/* Event header */
.event{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:10px;margin-bottom:12px}
.event-text{text-align:center;flex:1;min-width:0}
.event-text strong{display:block;font-size:17px;line-height:1.35;color:var(--gold-deep)}
.event-text span{font-size:14px;color:var(--muted)}
.logo{position:relative;flex:none;width:84px;height:84px;border-radius:12px;background:#ffffff;border:2px dashed #c39a3c;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;line-height:1.25;color:#6b5733;padding:4px;overflow:hidden;cursor:pointer}
.logo.has{border:0;padding:3px;cursor:default}
.logo img{width:100%;height:100%;object-fit:contain}
.logo input{position:absolute;inset:0;opacity:0;cursor:pointer}
.logo:focus-within{outline:3px solid var(--gold-deep);outline-offset:2px}

.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:16px 14px 18px;min-height:64vh;display:flex;flex-direction:column}
h1{margin:4px 0 6px;text-align:center;font-size:clamp(34px,10vw,52px);line-height:1.2;font-weight:900;color:var(--gold-deep)}
.lead{text-align:center;margin:0 auto 16px;max-width:28em;font-size:16px;line-height:1.7}
.ghost{background:transparent;border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;min-height:40px}
.lang{align-self:center;margin-bottom:4px}

/* The X-ray view box: stays dark in both themes, lights up when the word is solved */
.box{background:#17120a;border:4px solid var(--gold);border-radius:14px;padding:14px 8px;margin:0 0 12px;min-height:178px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;transition:background .45s}
.box.lit{background:#f2d88f}
.part{display:flex;flex-direction:column;align-items:center;min-width:74px}
.pic{font-size:clamp(56px,17vw,84px);line-height:1.12}
.art{display:block;width:1.15em;height:1.15em}.art.wide{width:1.96em}.art svg{display:block;width:100%;height:100%}

.plus{font-size:32px;font-weight:900;color:#d9b45b}
.lit .plus{color:#8a6a1c}
[dir=rtl] .art.wide svg{transform:scaleX(-1)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.status{font-weight:800;font-size:15px;white-space:nowrap}
.dots{display:flex;gap:6px}
.dots i{width:13px;height:13px;border-radius:50%;border:2px solid var(--gold);display:block}
.dots i.on{background:var(--gold)}
.hintbox{background:var(--tint);border-radius:10px;padding:8px 12px;margin:0 0 10px;font-size:16px;line-height:1.6;text-align:center}
[dir=rtl] input:placeholder-shown{direction:rtl}
[dir=ltr] input:placeholder-shown{direction:ltr}
form{display:flex;gap:8px;margin-bottom:8px}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:18px;font-weight:700;color:var(--ink);background:var(--plain);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.btn{background:var(--gold);color:var(--on-gold);border:2px solid var(--gold-deep);border-radius:12px;font-weight:900;font-size:17px;padding:10px 18px;min-height:48px}
.btn.plain{background:var(--plain);color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px}
.row .btn{flex:1;font-size:15px;padding:9px 6px}
.msg{min-height:24px;text-align:center;font-weight:800;margin:0 0 8px;color:var(--bad);font-size:15px}
.result{background:var(--goodbg);border-radius:14px;padding:12px;text-align:center;margin-bottom:12px}
.result.gave{background:var(--tint)}
.result b{display:block;font-size:28px;line-height:1.4}
.result p{margin:4px 0;line-height:1.6;font-size:15px}
.result span{font-weight:800}
.go{display:block;width:100%;margin-top:auto}
.startbtn{display:block;width:100%;max-width:320px;margin:8px auto 8px;font-size:22px;padding:14px}
.count{text-align:center;color:var(--muted);font-size:15px;margin:0}
.final{text-align:center;margin:auto 0}
.num{font-size:clamp(64px,20vw,104px);font-weight:900;line-height:1.1;color:var(--gold-deep)}
.final p{font-size:16px;margin:2px 0 14px}
.day{background:var(--tint);border-radius:12px;padding:12px;font-size:15px;line-height:1.7;margin:0 0 16px}
.final .btn{display:block;width:100%;max-width:340px;margin:0 auto 10px}
.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.logo{width:70px;height:70px}.event-text strong{font-size:15px}.part{min-width:62px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="event">
    <label class="logo" id="logoA"></label>
    <div class="event-text"><strong id="evName"></strong><span id="evDate"></span></div>
    <label class="logo" id="logoB"></label>
  </header>
  <main class="card" id="app"></main>
</div>

const T={

 pts:"نقطة",round:"4 أسئلة في كل جولة",play:"ابدأ",
 home:"الرئيسية",ph:"اكتب الكلمة",check:"تحقّق",hint:"تلميح",show:"أظهر الإجابة",next:"التالي",see:"شوف النتيجة",
 wrong:"مو هي. جرّب مرة ثانية أو خذ تلميح.",empty:"اكتب الكلمة أول.",right:"صح!",gave:"الإجابة",none:"بدون نقاط هالمرة",
 done:"خلصت الجولة",of:"من",correct:"إجابات صحيحة",again:"جولة جديدة",
 day:"في 8 نوفمبر 1895 اكتشف رونتجن الأشعة السينية، وفي هذا التاريخ نحتفل باليوم العالمي للأشعة وبكل العاملين فيها.",
 logoA:"شعار الحرس",logoB:"شعار اليوم العالمي"},
en:{dir:"ltr",event:"International Day of Radiology",date:"November 8, 2026",title:"Guess the word",lead:"The pictures point to a disease or a radiology term. Guess the word and type it in English or Arabic.",other:"العربية",
 pts:"pts",round:"4 questions each round",play:"Start",
 home:"Home",ph:"Type the word",check:"Check",hint:"Hint",show:"Show answer",next:"Next",see:"See my score",
 wrong:"Not that one. Try again or take a hint.",empty:"Type a word first.",right:"Correct!",gave:"The answer",none:"No points this round",
 done:"Round finished",of:"of",correct:"correct",again:"New round",
 day:"Röntgen discovered X-rays on November 8, 1895. On this date we mark the International Day of Radiology and celebrate everyone who works in it.",
 logoA:"NGHA logo",logoB:"Day logo"}
};
const ORDER=["easy","medium","hard"];
let lang="ar",S=null,deck=[];
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function norm(s){
  return s.trim().toUpperCase().replace(/[\u064B-\u0652\u0640]/g,"")
   .replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/ئ/g,"ي").replace(/ؤ/g,"و").replace(/ء/g,"")
   .split(/\s+/).map(w=>w.startsWith("ال")&&w.length>3?w.slice(2):w).join("")
   .replace(/[^A-Z\u0621-\u064A]/g,"");
}
function lev(a,b){
  let p=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){const c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}
  return p[b.length];
}
/* How many wrong letters still count, by word length. Very short words must match. */
const tol=n=>n<=3?0:n<=5?1:n<=9?2:3;
const isRight=(v,q)=>q.acc.some(a=>lev(v,a)<=tol(a.length));
/* Each Arabic puzzle and its English twin share the same list of accepted answers. */
const NEAR={
 easy:[["فراكتشر","فراكشر","BROKEN"],["نيمونيا","نيومونيا","التهاب في الرئة"],["كيدني ستون","كيدني ستونز","حصوة كلى"],["ليد ابرون","ابرون","مريلة واقية"]],
 medium:[["اوستيوبوروسس","اوستيوبوروسيس","هشاشة في العظام"],["كارديوميجالي","كارديوميقالي","قلب متضخم","قلب كبير"],["تي بي","تيوبركلوسيس"]],
 hard:[["سكوليوسس","سكوليوسيس","انحناء العمود الفقري"],["نيوموثوراكس","نيموثوراكس"],["بلورال افيوجن","سائل في الرئة"],["انسداد امعاء","انسداد في الأمعاء","BOWEL BLOCK"],["DOSE METER","بادج","بادج الجرعة"],["سكاتر","سكاتر راديشن"],["فلورو","FLUORO"]]
};
ORDER.forEach(l=>P.ar[l].forEach((q,i)=>{
  const e=P.en[l][i];
  q.acc=e.acc=[q.a,...(q.alt||[]),e.a,...(e.alt||[]),...NEAR[l][i]].map(norm);
  q.other=e.a;e.other=q.a;
}));
function logo(id,src,label){
  const el=document.getElementById(id);
  el.className="logo"+(src?" has":"");
  if(src){el.innerHTML=`<img src="${src}" alt="${esc(label)}">`;return}
  el.innerHTML=`<span>${esc(label)}</span><input type="file" accept="image/*" aria-label="${esc(label)}">`;
  el.querySelector("input").onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();r.onload=()=>{LOGOS[id==="logoA"?"ngha":"day"]=r.result;header()};r.readAsDataURL(f);
  };
}
function header(){
  const t=T[lang];
  document.documentElement.lang=lang;document.documentElement.dir=t.dir;document.title=t.title+" | "+t.event;
  document.getElementById("evName").textContent=t.event;
  document.getElementById("evDate").textContent=t.date;
  logo("logoA",LOGOS.ngha,t.logoA);logo("logoB",LOGOS.day,t.logoB);
}
function partHTML(p){
  return `<div class="part"><span class="pic">${p.s?`<span class="art ${p.wide?"wide":""}">${ART[p.s]}</span>`:p.e}</span></div>`;
}
function box(parts,cls=""){
  return `<div class="box ${cls}">`+parts.map(partHTML).join(`<span class="plus" aria-hidden="true">+</span>`)+`</div>`;
}
function home(){
  S=null;header();
  const t=T[lang];
  app.innerHTML=`<button class="ghost lang" id="sw">${t.other}</button><h1>${t.title}</h1><p class="lead">${t.lead}</p>
  <button class="btn startbtn" id="go">${t.play}</button><p class="count">${t.round}</p>`;
  app.querySelector("#sw").onclick=()=>{lang=lang==="ar"?"en":"ar";deck=[];home()};
  app.querySelector("#go").onclick=start;
}
function start(){
  if(deck.length<ROUND)deck=[...deck,...shuffle(ORDER.flatMap(l=>P[lang][l]).filter(x=>!deck.includes(x)))];
  S={q:deck.splice(0,ROUND),i:0,score:0,right:0};load();
}
function load(){Object.assign(S,{hints:0,state:"play",msg:"",gain:0});draw(true)}
function draw(focus,keep=""){
  const t=T[lang],q=S.q[S.i],done=S.state!=="play";
  const dots=S.q.map((_,i)=>`<i class="${i<S.i+(done?1:0)?"on":""}"></i>`).join("");
  const hb=S.hints>=1?`<p class="hintbox">${esc(q.h)}</p>`:"";
  const last=S.i===S.q.length-1;
  const body=done
   ?`<div class="result ${S.state==="gave"?"gave":""}" role="status"><span>${S.state==="gave"?t.gave:t.right+" +"+S.gain}</span><b>${esc(q.a)}</b><p><bdi>${esc(q.other)}</bdi></p><p>${esc(q.h)}</p>${S.state==="gave"?`<p>${t.none}</p>`:""}</div>
     <button class="btn go" id="next">${last?t.see:t.next}</button>`
   :`${hb}<form id="f"><input type="text" id="in" dir="auto" autocomplete="off" spellcheck="false" placeholder="${t.ph}" aria-label="${t.ph}" value="${esc(keep)}"><button class="btn">${t.check}</button></form>
     <p class="msg" role="status">${esc(S.msg)}</p>
     <div class="row"><button class="btn plain" id="h" ${S.hints>=1?"disabled":""}>${t.hint}</button><button class="btn plain" id="sh">${t.show}</button></div>`;
  app.innerHTML=`<div class="top"><button class="ghost" id="back">${t.home}</button><div class="dots" role="img" aria-label="${S.i+1} ${t.of} ${S.q.length}">${dots}</div><span class="status">${S.score} ${lang==="ar"?"نقطة":t.pts}</span></div>
   ${box(q.p,S.state==="right"?"lit":"")}${body}`;
  app.querySelector("#back").onclick=home;
  if(done){const n=app.querySelector("#next");n.onclick=advance;n.focus();return}
  app.querySelector("#f").onsubmit=submit;
  app.querySelector("#h").onclick=()=>{const v=app.querySelector("#in").value;S.hints++;S.msg="";draw(false,v)};
  app.querySelector("#sh").onclick=()=>{S.state="gave";draw()};
  if(focus&&matchMedia("(min-width:700px)").matches)app.querySelector("#in").focus();
}
function submit(e){
  e.preventDefault();
  const t=T[lang],q=S.q[S.i],inp=app.querySelector("#in"),v=norm(inp.value);
  if(!v){S.msg=t.empty;draw(false);return}
  if(isRight(v,q)){
    S.gain=S.hints?HINT_POINTS:POINTS;S.score+=S.gain;S.right++;S.state="right";draw();
  }else{
    S.msg=t.wrong;draw(false,inp.value);app.querySelector("#f").classList.add("shake");
  }
}
function advance(){S.i++;S.i<S.q.length?load():finish()}
function finish(){
  const t=T[lang];
  app.innerHTML=`<div class="final"><h1>${t.done}</h1><div class="num">${S.score}</div><p>${S.right} ${t.of} ${S.q.length} ${t.correct}</p>
   <p class="day">${t.day}</p>
   <button class="btn" id="ag">${t.again}</button><button class="btn plain" id="hm">${t.home}</button></div>`;
  app.querySelector("#ag").onclick=start;
  app.querySelector("#hm").onclick=home;
}
home();
</script>
